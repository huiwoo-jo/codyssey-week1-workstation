services:
  web:
    build: .
    ports:
      - "${PORT:-8082}:80"
    environment:
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      - redis
    networks:
      - app-net

  redis:
    image: redis:alpine
    container_name: my-redis
    ports:
      - "6379:6379"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
